name: CICDWASM Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:   # manual run button

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore -c Release
  
  tests:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build tests
        run: dotnet build CICDWASM.Tests/CICDWASM.Tests.csproj -c Release

      - name: Run tests
        run: |
            dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj \
            --no-build \
            -c Release \
            --logger "trx" \
            --results-directory ./CICDWASM/TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./CICDWASM/TestResults/**/*.trx

      - name: Find TRX files
        run: find . -name "*.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Tests
          path: ./CICDWASM/TestResults/**/*.trx
          reporter: dotnet-trx
  
  deploy:
    needs: tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish app
      run: dotnet publish CICDWASM/CICDWASM.csproj -c Release -o release

    - name: Fix base href
      run: |
        sed -i 's|<base href="/"[^>]*>|<base href="/${{ github.event.repository.name }}/">|g' release/wwwroot/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: release/wwwroot

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Add summary - monitoring
      if: always()
      run: |
        echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Tests executed" >> $GITHUB_STEP_SUMMARY
        echo "- Deployment attempted" >> $GITHUB_STEP_SUMMARY

    - name: Show publish output - explicit logging
      run: ls -R release/wwwroot

    - name: Verify deployment
      run: |
        URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Checking $URL"
        curl -f $URL || exit 1

    - name: Check Blazor assets
      run: |
        URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/_framework/blazor.webassembly.js"
        curl -f $URL || exit 1

    - name: Validate page content
      run: |
        URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        curl -s $URL | grep "<title>" || exit 1

    - name: Notify on failure
      if: failure()
      run: echo "Deployment failed!"

  code-coverage:
    needs: tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run tests with coverage
      run: dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj -c Release --collect:"XPlat Code Coverage"

    - name: Find coverage files
      run: find . -name "coverage.cobertura.xml"

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: ~/.dotnet/tools/reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report

    - name: Extract coverage
      id: coverage
      run: |
       FILE=$(find . -name coverage.cobertura.xml | head -n 1)
       echo "Using file: $FILE"
       RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$FILE" | head -n 1)
       echo "Raw rate: $RATE"
       # Safe conversion (no awk issues)
       PERCENT=$(python3 -c "print(int(float('$RATE') * 100))")
       echo "Coverage: $PERCENT%"
       echo "value=$PERCENT" >> $GITHUB_OUTPUT

    - name: Coverage Check
      uses: actions/github-script@v7
      with:
       script: |
        const coverage = "${{ steps.coverage.outputs.value }}";
        const threshold = 7;

        await github.rest.checks.create({
        owner: context.repo.owner,
        repo: context.repo.repo,
        name: "Coverage",
        head_sha: context.sha,
        status: "completed",
        conclusion: coverage >= threshold ? "success" : "failure",
        output: {
          title: "Code Coverage",
          summary: `Coverage: ${coverage}% (threshold: ${threshold}%)`
        }
        });

    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
       filename: "**/coverage.cobertura.xml"
       badge: true
       format: markdown
       output: both

    - name: Add coverage to summary
      run: |
       echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
       echo "See details above or download artifact." >> $GITHUB_STEP_SUMMARY

  sonar-cloud:
    needs: tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # IMPORTANT for Sonar

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Add tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    # 🔹 START
    - name: Sonar Begin
      run: |
        dotnet-sonarscanner begin \
          /k:"${{ vars.SONAR_PROJECT_KEY }}" \
          /o:"${{ vars.SONAR_ORGANIZATION }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.cobertura.xml"

    # 🔹 BUILD (MANDATORY - this is what you were missing conceptually)
    - name: Build solution
      run: dotnet build -c Release

    # 🔹 TEST (optional coverage)
    - name: Test with coverage
      run: |
        dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj \
          -c Release \
          --no-build \
          --collect:"XPlat Code Coverage"

    # 🔹 END
    - name: Sonar End
      run: dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"