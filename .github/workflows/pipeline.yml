name: CICDWASM Pipeline

on:
  push:
    branches: [ main, develop ]

  pull_request:
    branches: [ main, develop ]
    types: [opened, reopened, synchronize, closed]

  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pages: write
  id-token: write
  pull-requests: write

jobs:

# =========================
# BUILD
# =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore -c Release
         
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
         name: build-output
         path: |
           **/bin/Release
           **/obj/Release
  
# =========================
# TESTS
# =========================
  tests:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build tests
        run: dotnet build CICDWASM.Tests/CICDWASM.Tests.csproj -c Release

      - name: Run tests
        run: |
            dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj \
            --no-build \
            -c Release \
            --logger "trx" \
            --results-directory ./CICDWASM/TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./CICDWASM/TestResults/**/*.trx

      - name: Find TRX files
        run: find . -name "*.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Tests
          path: ./CICDWASM/TestResults/**/*.trx
          reporter: dotnet-trx
  
# =========================
# CODE COVERAGE
# =========================
  code-coverage:
    needs: tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run tests with coverage
      run: dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj -c Release --collect:"XPlat Code Coverage"

    - name: Find coverage files
      run: find . -name "coverage.cobertura.xml"

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: ~/.dotnet/tools/reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report

    - name: Extract coverage
      id: coverage
      run: |
       FILE=$(find . -name coverage.cobertura.xml | head -n 1)
       echo "Using file: $FILE"
       RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$FILE" | head -n 1)
       echo "Raw rate: $RATE"
       # Safe conversion (no awk issues)
       PERCENT=$(python3 -c "print(int(float('$RATE') * 100))")
       echo "Coverage: $PERCENT%"
       echo "value=$PERCENT" >> $GITHUB_OUTPUT

    - name: Coverage Check
      uses: actions/github-script@v7
      with:
       script: |
        const coverage = "${{ steps.coverage.outputs.value }}";
        const threshold = 7;

        await github.rest.checks.create({
        owner: context.repo.owner,
        repo: context.repo.repo,
        name: "Coverage",
        head_sha: context.sha,
        status: "completed",
        conclusion: coverage >= threshold ? "success" : "failure",
        output: {
          title: "Code Coverage",
          summary: `Coverage: ${coverage}% (threshold: ${threshold}%)`
        }
        });

    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
       filename: "**/coverage.cobertura.xml"
       badge: true
       format: markdown
       output: both

    - name: Add coverage to summary
      run: |
       echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
       echo "See details above or download artifact." >> $GITHUB_STEP_SUMMARY

    - name: Comment Coverage
      if: github.event_name == 'pull_request' && github.event.action != 'closed'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: coverage
        message: |
          ## Coverage Report
          Coverage: **${{ steps.coverage.outputs.value }}%**

    - name: Coverage Gate
      run: |
       COVERAGE=${{ steps.coverage.outputs.value }}
       THRESHOLD=7

       echo "Coverage: $COVERAGE%"
       echo "Threshold: $THRESHOLD%"

       if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
        echo "Coverage below threshold"
        exit 1
       fi

# =========================
# SONAR CLOUD
# =========================
  sonar-cloud:
   needs: tests
   runs-on: ubuntu-latest

   steps:
    # ======================
    # 1. Checkout FULL history (important for Sonar)
    # ======================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ======================
    # 2. Setup .NET
    # ======================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # ======================
    # 3. Install Sonar Scanner
    # ======================
    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Add tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    # ======================
    # 4. START ANALYSIS
    # ======================
    - name: Sonar Begin (Push)
      if: github.event_name != 'pull_request'
      run: |
        dotnet-sonarscanner begin \
        /k:"${{ vars.SONAR_PROJECT_KEY }}" \
        /o:"${{ vars.SONAR_ORGANIZATION }}" \
        /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}" \
        /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
        /d:sonar.cs.opencover.reportsPaths="**/coverage.cobertura.xml" \
        /d:sonar.exclusions="**/bin/**,**/obj/**,**/.vs/**,**/.github/**"

    - name: Sonar Begin (PR)
      if: github.event_name == 'pull_request' && github.event.action != 'closed'
      run: |
        dotnet-sonarscanner begin \
        /k:"${{ vars.SONAR_PROJECT_KEY }}" \
        /o:"${{ vars.SONAR_ORGANIZATION }}" \
        /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}" \
        /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
        /d:sonar.cs.opencover.reportsPaths="**/coverage.cobertura.xml" \
        /d:sonar.exclusions="**/bin/**,**/obj/**,**/.vs/**,**/.github/**" \
        /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
        /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
        /d:sonar.pullrequest.base="${{ github.base_ref }}"

    # ======================
    # 5. BUILD SOLUTION (CRITICAL)
    # ======================
    - name: Build solution
      run: dotnet build CICDWASM.slnx -c Release

    # ======================
    # 6. RUN TESTS + COVERAGE
    # ======================
    - name: Test with coverage
      run: |
        dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj \
          -c Release \
          --no-build \
          --collect:"XPlat Code Coverage"

    # ======================
    # 7. END ANALYSIS
    # ======================
    - name: Sonar End
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Verify report file
      run: |
        ls -la .sonarqube/out/.sonar/
        cat .sonarqube/out/.sonar/report-task.txt

    - name: Sonar Quality Gate
      uses: SonarSource/sonarqube-quality-gate-action@master
      with:
       scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
      env:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Debug Sonar output
      if: always()
      run: |
        echo "Searching for report-task.txt"
        find . -name report-task.txt

        echo "Searching for sonar directories"
        find . -type d | grep sonar || true


# =========================
# PR PREVIEW DEPLOYMENT
# =========================
  pr-preview:
    needs: [build, tests, code-coverage, sonar-cloud]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: dotnet publish CICDWASM/CICDWASM.csproj -c Release -o publish

      - name: Fix base href
        run: |
          sed -i "s|<base href=\"/\"|<base href=\"/CICDWASM/pr-${{ github.event.pull_request.number }}/\"|g" publish/wwwroot/index.html

      - name: Deploy PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish/wwwroot
          destination_dir: pr-${{ github.event.pull_request.number }}

      - name: Comment PR preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🚀 **PR Preview deployed**

            👉 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/


# =========================
# CLEANUP PREVIEW (PR CLOSED)
# =========================
  cleanup-pr-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Checkout gh-pages safely
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch origin gh-pages || exit 0
          git checkout -B gh-pages origin/gh-pages || git checkout --orphan gh-pages

      - name: Determine PR folder
        id: pr
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "pr=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Remove preview folder safely
        run: |
          FOLDER="pr-${{ steps.pr.outputs.pr }}"

          if [ -d "$FOLDER" ]; then
            rm -rf "$FOLDER"
          else
            echo "Folder $FOLDER does not exist - skipping"
            exit 0
          fi

      - name: Commit cleanup safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "cleanup PR #${{ steps.pr.outputs.pr }}" || echo "Nothing to commit"

          git push origin gh-pages || echo "Nothing to push"


# =========================
# PRODUCTION DEPLOY (ONLY MAIN)
# =========================        
  deploy:
    needs: [build, tests, code-coverage, sonar-cloud]
    if: github.event_name != 'pull-request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish app
      run: dotnet publish CICDWASM/CICDWASM.csproj -c Release -o publish

    - name: Fix base href
      run: |
        sed -i 's|<base href="/"[^>]*>|<base href="/${{ github.event.repository.name }}/">|g' publish/wwwroot/index.html

    - name: Upload published app artifact
      uses: actions/upload-artifact@v4
      with:
       name: published-blazor-app
       path: publish/wwwroot

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: publish/wwwroot

    - name: Deploy to GitHub Pages
      id: deployment
      uses: peaceiris/actions-gh-pages@v4
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish/wwwroot
          destination_dir: ""

    - name: Add summary - monitoring
      if: always()
      run: |
        echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Tests executed" >> $GITHUB_STEP_SUMMARY
        echo "- Deployment attempted" >> $GITHUB_STEP_SUMMARY

    - name: Show publish output - explicit logging
      run: ls -R publish/wwwroot

    - name: Verify deployment
      run: |
        URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Checking $URL"
        curl -f $URL || exit 1

    - name: Check Blazor assets
      run: |
        URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/_framework/blazor.webassembly.js"
        curl -f $URL || exit 1

    - name: Validate page content
      run: |
        URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        curl -s $URL | grep "<title>" || exit 1

    - name: Notify on failure
      if: failure()
      run: echo "Deployment failed!"
