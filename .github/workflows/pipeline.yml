name: Build, Test, Coverage, Deploy & Monitor

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write

env:
  COVERAGE_THRESHOLD: 0.1

jobs:
# =========================
# CI (Build + Test + Coverage)
# =========================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build -c Release

      - name: Run tests with coverage
        run: |
          dotnet test CICDWASM.Tests/CICDWASM.Tests.csproj \
            -c Release \
            --no-build \
            --logger "trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Tests
          path: "**/*.trx"
          reporter: dotnet-trx

      - name: Find coverage file
        id: covfile
        run: echo "file=$(find . -name coverage.cobertura.xml | head -n 1)" >> $GITHUB_OUTPUT

      - name: Extract coverage %
        id: coverage
        run: |
          FILE=${{ steps.covfile.outputs.file }}
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$FILE")
          PERCENT=$(awk "BEGIN {print int($LINE_RATE * 100)}")
          echo "value=$PERCENT" >> $GITHUB_OUTPUT

      # =========================
      # COVERAGE GATE (FAIL BUILD)
      # =========================
      - name: Enforce coverage threshold
        run: |
          echo "Coverage: ${{ steps.coverage.outputs.value }}%"
          if [ "${{ steps.coverage.outputs.value }}" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "Coverage below threshold!"
            exit 1
          fi

      # =========================
      # COVERAGE CHECK (GitHub UI)
      # =========================
      - name: Create coverage check
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = "${{ steps.coverage.outputs.value }}";
            const threshold = process.env.COVERAGE_THRESHOLD;
            const status = coverage >= threshold ? "success" : "failure";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Code Coverage",
              head_sha: context.sha,
              status: "completed",
              conclusion: status,
              output: {
                title: "Coverage Report",
                summary: `Coverage: ${coverage}% (Threshold: ${threshold}%)`
              }
            });

      # =========================
      # PR COMMENT (Monitoring visibility)
      # =========================
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = "${{ steps.coverage.outputs.value }}";

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📊 Coverage Report\n- Coverage: **${coverage}%**`
            });

      # =========================
      # SUMMARY
      # =========================
      - name: CI Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: executed" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: ${{ steps.coverage.outputs.value }}%" >> $GITHUB_STEP_SUMMARY

# =========================
# DEPLOY
# =========================
  deploy:
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish CICDWASM/CICDWASM.csproj -c Release -o release

      - name: Fix base href
        run: |
          sed -i 's|<base href="/"[^>]*>|<base href="/${{ github.event.repository.name }}/">|g' release/wwwroot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

# =========================
# DEPLOYMENT MONITORING
# =========================
      - name: Verify site is reachable
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -f "$URL/" || exit 1

      - name: Verify Blazor assets
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -f "$URL/_framework/blazor.webassembly.js" || exit 1

      - name: Health summary
        if: always()
        run: |
          echo "## Deployment Monitoring" >> $GITHUB_STEP_SUMMARY
          echo "- Site reachable: checked" >> $GITHUB_STEP_SUMMARY
          echo "- Blazor assets: checked" >> $GITHUB_STEP_SUMMARY